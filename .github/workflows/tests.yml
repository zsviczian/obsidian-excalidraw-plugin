name: Plugin tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXCALIDRAW_FORK_ROOT: ${{ github.workspace }}/.test-work/checkouts/fork
      EXCALIDRAW_TEST_FORK_TYPES_ROOT: ${{ github.workspace }}/.test-work/checkouts/fork
      EXCALIDRAW_EXTRAS_ROOT: ${{ github.workspace }}/.test-work/checkouts/extras
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zsviczian/excalidraw
          ref: d04bc1a6211a15394a1cc7036e7a7532608bf421
          path: .test-work/checkouts/fork
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zsviczian/obsidian-excalidraw-extras
          ref: e37c06feff9fef48877f565328762433a676afcc
          path: .test-work/checkouts/extras
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: corepack enable
      - run: yarn --cwd .test-work/checkouts/fork install --frozen-lockfile
      - run: npm ci --prefix .test-work/checkouts/extras
      - name: Build and freeze the reviewed workspace combination
        run: npm run test:build-workspace
      - run: npm run lib
      - run: npm run test:fixtures
      - run: npm run test:inventory
      - run: npm run test:features
      - run: npm run test:fast
      - run: npm run test:source-coverage
      - run: node --check dist/main.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-portable-evidence
          path: |
            .test-work/reports
            .test-work/frozen/**/combination.json
            .test-work/frozen/**/artifacts.json
          if-no-files-found: error
